name: Version bump check
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Define shippable patterns — files that ship in the extension ZIP
          # and therefore require a version bump when modified.
          SHIPPABLE=$(echo "$CHANGED" | grep -E '^(manifest\.json|scripts/|styles/|icons/|fonts/|.*\.html$|.*\.js$|_locales/)' || true)
          SHIPPABLE_COUNT=$(echo "$SHIPPABLE" | grep -v '^$' | wc -l)

          echo "Shippabl
